[package]
name = "silentnode_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "silentnode_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "silentnode_core"
path = "src/main.rs"

[features]
default = []
audio   = ["dep:cpal"]
process = ["dep:sysinfo"]
python  = ["dep:pyo3", "pyo3/auto-initialize"]
python-ext = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
argon2 = "0.5"
bytemuck = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
glam = { version = "0.29", features = ["bytemuck"] }
petgraph = { version = "0.8", features = ["serde-1"] }
pollster = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "2.4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
image = { version = "0.25", default-features = false, features = ["png"] }
cpal    = { version = "0.15", optional = true }
sysinfo = { version = "0.31", optional = true }
pyo3    = { version = "0.22", optional = true }
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1", features = ["serde", "v4"] }
wgpu = { version = "22", features = ["wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
