<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Deep space background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#04080f"/>
    </radialGradient>

    <!-- Core node glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40c8ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1a6fff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d2fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40c8ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#40c8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Satellite node gradients -->
    <radialGradient id="nodeA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost node gradient -->
    <radialGradient id="ghost" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>

  <!-- Subtle star field -->
  <circle cx="42"  cy="38"  r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="118" cy="22"  r="0.6" fill="#ffffff" opacity="0.3"/>
  <circle cx="290" cy="55"  r="0.9" fill="#ffffff" opacity="0.5"/>
  <circle cx="358" cy="30"  r="0.7" fill="#ffffff" opacity="0.35"/>
  <circle cx="370" cy="140" r="0.6" fill="#ffffff" opacity="0.3"/>
  <circle cx="28"  cy="210" r="0.8" fill="#ffffff" opacity="0.4"/>
  <circle cx="380" cy="310" r="0.7" fill="#ffffff" opacity="0.3"/>
  <circle cx="60"  cy="350" r="0.6" fill="#ffffff" opacity="0.35"/>
  <circle cx="330" cy="375" r="0.9" fill="#ffffff" opacity="0.45"/>
  <circle cx="160" cy="385" r="0.6" fill="#ffffff" opacity="0.3"/>
  <circle cx="75"  cy="90"  r="0.5" fill="#40c8ff" opacity="0.4"/>
  <circle cx="340" cy="200" r="0.5" fill="#a78bfa" opacity="0.35"/>

  <!-- ═══ EDGES (drawn first, behind nodes) ═══ -->

  <!-- Core → Node A (violet, resonance) -->
  <line x1="200" y1="200" x2="112" y2="118"
        stroke="#a78bfa" stroke-width="1.2" stroke-opacity="0.55" filter="url(#glow)"/>
  <!-- Core → Node B (green, causal) -->
  <line x1="200" y1="200" x2="310" y2="130"
        stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)"/>
  <!-- Core → Node C (amber, temporal) -->
  <line x1="200" y1="200" x2="300" y2="290"
        stroke="#fbbf24" stroke-width="1.0" stroke-opacity="0.5" filter="url(#glow)"/>
  <!-- Core → Node D (red) -->
  <line x1="200" y1="200" x2="100" y2="295"
        stroke="#f87171" stroke-width="0.9" stroke-opacity="0.45" filter="url(#glow)"/>
  <!-- Core → Node E (cyan) -->
  <line x1="200" y1="200" x2="200" y2="310"
        stroke="#67e8f9" stroke-width="1.1" stroke-opacity="0.5" filter="url(#glow)"/>
  <!-- Node A → Node B (cross edge) -->
  <line x1="112" y1="118" x2="310" y2="130"
        stroke="#6366f1" stroke-width="0.7" stroke-opacity="0.3" filter="url(#glow)"/>
  <!-- Node B → Node C -->
  <line x1="310" y1="130" x2="300" y2="290"
        stroke="#10b981" stroke-width="0.7" stroke-opacity="0.28"/>
  <!-- Node A → Node D -->
  <line x1="112" y1="118" x2="100" y2="295"
        stroke="#94a3b8" stroke-width="0.6" stroke-opacity="0.22"/>
  <!-- Ghost node edge (dashed, fading) -->
  <line x1="200" y1="200" x2="268" y2="72"
        stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.22"
        stroke-dasharray="4 4"/>

  <!-- ═══ OUTER AURA of core ═══ -->
  <circle cx="200" cy="200" r="62" fill="url(#aura)"/>

  <!-- ═══ CORE NODE ═══ -->
  <!-- Halo rings -->
  <circle cx="200" cy="200" r="40" fill="none"
          stroke="#40c8ff" stroke-width="0.6" stroke-opacity="0.18"/>
  <circle cx="200" cy="200" r="30" fill="none"
          stroke="#40c8ff" stroke-width="0.8" stroke-opacity="0.28"/>
  <!-- Core body -->
  <circle cx="200" cy="200" r="22" fill="url(#coreGlow)" filter="url(#coreFilter)"/>
  <circle cx="200" cy="200" r="14" fill="#40c8ff" opacity="0.92"/>
  <!-- Inner bright spot -->
  <circle cx="196" cy="196" r="5" fill="#c4f0ff" opacity="0.85"/>
  <!-- Selection ring (pulsing feel) -->
  <circle cx="200" cy="200" r="26" fill="none"
          stroke="#40c8ff" stroke-width="1.8" stroke-opacity="0.55" filter="url(#glow)"/>

  <!-- ═══ SATELLITE NODES ═══ -->

  <!-- Node A — Violet (112, 118) — Resonance type -->
  <circle cx="112" cy="118" r="16" fill="url(#nodeA)" filter="url(#softGlow)" opacity="0.6"/>
  <circle cx="112" cy="118" r="9"  fill="#a78bfa" opacity="0.9"/>
  <circle cx="109" cy="115" r="3"  fill="#ddd6fe" opacity="0.8"/>
  <circle cx="112" cy="118" r="13" fill="none"
          stroke="#a78bfa" stroke-width="0.9" stroke-opacity="0.4"/>

  <!-- Node B — Green (310, 130) — Active/Forge type -->
  <circle cx="310" cy="130" r="18" fill="url(#nodeB)" filter="url(#softGlow)" opacity="0.55"/>
  <circle cx="310" cy="130" r="11" fill="#34d399" opacity="0.88"/>
  <circle cx="307" cy="127" r="4"  fill="#a7f3d0" opacity="0.75"/>
  <circle cx="310" cy="130" r="15" fill="none"
          stroke="#34d399" stroke-width="1.0" stroke-opacity="0.38"/>

  <!-- Node C — Amber (300, 290) — Crystallizing -->
  <circle cx="300" cy="290" r="13" fill="url(#nodeC)" filter="url(#softGlow)" opacity="0.55"/>
  <circle cx="300" cy="290" r="8"  fill="#fbbf24" opacity="0.85"/>
  <circle cx="298" cy="288" r="2.5" fill="#fef3c7" opacity="0.8"/>
  <!-- Crystallizing wireframe hint -->
  <polygon points="300,280 308,293 292,293"
           fill="none" stroke="#fbbf24" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Node D — Red/Crimson (100, 295) — Ghost adjacent -->
  <circle cx="100" cy="295" r="10" fill="url(#nodeD)" filter="url(#softGlow)" opacity="0.5"/>
  <circle cx="100" cy="295" r="6"  fill="#f87171" opacity="0.78"/>
  <circle cx="98"  cy="293" r="2"  fill="#fecaca" opacity="0.7"/>

  <!-- Node E — Cyan (200, 310) — Deep Focus -->
  <circle cx="200" cy="310" r="11" fill="url(#nodeE)" filter="url(#softGlow)" opacity="0.55"/>
  <circle cx="200" cy="310" r="7"  fill="#67e8f9" opacity="0.85"/>
  <circle cx="198" cy="308" r="2.5" fill="#cffafe" opacity="0.8"/>

  <!-- Ghost node (268, 72) — Faded, dashed outline -->
  <circle cx="268" cy="72" r="12"  fill="#1e293b" opacity="0.6"/>
  <circle cx="268" cy="72" r="7"   fill="#475569" opacity="0.45"/>
  <circle cx="268" cy="72" r="11"  fill="none"
          stroke="#64748b" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 3"/>

  <!-- ═══ CONTAGION RIPPLE from core ═══ -->
  <circle cx="200" cy="200" r="52" fill="none"
          stroke="#40c8ff" stroke-width="0.5" stroke-opacity="0.12"/>
  <circle cx="200" cy="200" r="78" fill="none"
          stroke="#40c8ff" stroke-width="0.4" stroke-opacity="0.06"/>

  <!-- ═══ WORDMARK ═══ -->
  <!-- "SilentNode" text -->
  <text x="200" y="356"
        font-family="'SF Mono', 'JetBrains Mono', 'Fira Mono', monospace"
        font-size="20"
        font-weight="600"
        letter-spacing="4"
        text-anchor="middle"
        fill="#e2e8f0"
        opacity="0.92">SILENTNODE</text>

  <!-- Tagline -->
  <text x="200" y="375"
        font-family="'SF Mono', 'JetBrains Mono', 'Fira Mono', monospace"
        font-size="8.5"
        letter-spacing="2.5"
        text-anchor="middle"
        fill="#40c8ff"
        opacity="0.65">LIVING COGNITIVE ENVIRONMENT</text>

  <!-- Subtle border -->
  <rect width="400" height="400" rx="32"
        fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.6"/>
</svg>
