[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "silentnode_py"
version = "0.1.0"
description = "Python Analysis Brain for SilentNode — Pattern Intelligence & Social Graph"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "python-louvain>=0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["silentnode_py*"]
